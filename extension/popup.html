<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Orbis</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Orbis</h1>

        <p class="subtitle">
            Real-Time AI Voice Translation
        </p>

        <div class="status">
            <span id="statusIndicator">●</span>
            <span id="statusText">Microphone disconnected</span>
        </div>

        <button id="startButton">
            Start Microphone
        </button>

        <button id="stopButton" disabled>
            Stop Microphone
        </button>

    </div>

    <script src="popup.js"></script>

</body>

</html>
