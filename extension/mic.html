<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Orbis Microphone Setup</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            width: 420px;
            padding: 30px;

            background: white;
            border-radius: 12px;

            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);

            text-align: center;
        }

        h1 {
            margin-top: 0;
        }

        p {
            color: #666;
            line-height: 1.5;
        }

        button {
            width: 100%;
            padding: 12px;

            margin-top: 15px;

            border: none;
            border-radius: 6px;

            background: #222;
            color: white;

            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        #status {
            margin-top: 20px;
            font-weight: bold;
        }
        
    </style>
</head>

<body>

    <div class="container">

        <h1>🎤 Orbis Microphone</h1>

        <p>
            Orbis needs microphone access to capture speech
            for real-time translation.
        </p>

        <button id="allowButton">
            Allow Microphone
        </button>

        <div id="status">
            Microphone not connected
        </div>
        <div class="audio-meter">
            <div id="audioLevel"></div>
        </div>

        <p id="audioStatus">
            Waiting for audio...
        </p>
        <p id="audioValue">
            Audio level: 0%
        </p>


    </div>

    <script src="mic.js"></script>

</body>

</html>
