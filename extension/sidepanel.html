<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Orbis</title>

    <link
        rel="stylesheet"
        href="sidepanel.css"
    >

</head>

<body>

    <div class="container">

        <header>

            <h1>Orbis</h1>

            <p class="subtitle">
                Real-Time AI Voice Translation
            </p>

        </header>

        <section class="status-card">

        <div class="status">

            <span
                id="statusIndicator"
                class="status-indicator"
            >
                ●
            </span>

            <span id="statusText">
                Microphone disconnected
            </span>

        </div>


            <div class="connection-status">

                <span
                    id="websocketIndicator"
                    class="status-indicator"
                >
                    ●
                </span>

                <span id="websocketStatus">
                    Backend disconnected
                </span>

            </div>

        </section>
        


        <section class="control-card">

            <button
                id="startButton"
                class="primary-button"
            >
                Start Microphone
            </button>

            <button
                id="stopButton"
                class="secondary-button"
                disabled
            >
                Stop Microphone
            </button>

        </section>


        <section class="audio-card">

            <h2>Audio Level</h2>

            <div class="audio-meter">

                <div id="audioLevel"></div>

            </div>

            <div id="audioStatus">
                Waiting for microphone...
            </div>

            <div id="audioValue">
                0%
            </div>

        </section>


        <section class="language-card">

            <h2>Target Language</h2>

            <select id="targetLanguage">

                <option value="en">
                    English
                </option>

                <option value="hi">
                    Hindi
                </option>

                <option value="fr">
                    French
                </option>

                <option value="es">
                    Spanish
                </option>

                <option value="de">
                    German
                </option>

                <option value="nl">
                    Dutch
                </option>

                <option value="ja">
                    Japanese
                </option>

                <option value="zh">
                    Chinese
                </option>

                <option value="ko">
                    Korean
                </option>

            </select>


        </section>
        <section class="translation-card">

            <h2>Live Translation</h2>

            <div class="translation-section">

                <div class="translation-label">
                    Original Speech
                </div>

                <div
                    id="originalText"
                    class="translation-text"
                >
                    Waiting for speech...
                </div>

            </div>


            <div class="translation-section">

                <div class="translation-label">
                    Translation
                </div>

                <div
                    id="translatedText"
                    class="translation-text"
                >
                    Waiting for translation...
                </div>

            </div>

        </section>

        <footer>

            <p>
                Orbis • Your Voice, Without Borders
            </p>

        </footer>

    </div>


    <script src="sidepanel.js"></script>

</body>

</html>
